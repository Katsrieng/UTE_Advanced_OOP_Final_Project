<nav class="pagination" aria-label="Pagination">
<p>Showing {{ (page-1)*8+1 if total else 0 }}–{{ [page*8,total]|min }} of {{ total }} results</p>
<div>
{% if page > 1 %}
<a class="btn secondary small" href="{{ page_url(page-1) }}">← Previous</a>
{% else %}
<button class="btn secondary small" disabled>← Previous</button>
{% endif %}
<span class="page-number" aria-current="page">{{ page }}</span>
<span class="page-of">of {{ pages }}</span>
{% if page < pages %}
<a class="btn secondary small" href="{{ page_url(page+1) }}">Next →</a>
{% else %}
<button class="btn secondary small" disabled>Next →</button>
{% endif %}
</div>
</nav>
